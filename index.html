<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>nuts_mahjongsystem</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>


  <!-- ==========================================
       メインメニュー
       ========================================== -->

  <div id="main-menu-screen" class="screen">

    <h2>なっつ麻雀部</h2>

    <button onclick="showGameStart()">
      対局する
    </button>

    <button onclick="showPlayerManagement()">
      プレイヤー管理
    </button>

    <button onclick="showStatistics()">
      成績閲覧
    </button>

    <button onclick="showGameHistory()">
      対局履歴
    </button>

  </div>


  <!-- ==========================================
       プレイヤー管理
       ========================================== -->

  <div id="player-management-screen"
       class="screen"
       style="display: none;">

    <h2>プレイヤー管理</h2>

    <div id="player-list"></div>

    <h3>プレイヤーを追加</h3>

    <input
      type="text"
      id="new-player-name"
      placeholder="プレイヤー名を入力">

    <button onclick="addPlayer()">
      プレイヤーを追加
    </button>

    <button onclick="showMainMenu()">
      メインメニューへ
    </button>

  </div>


  <!-- ==========================================
       プレイヤー選択
       ========================================== -->

  <div id="name-input-screen"
       class="screen"
       style="display: none;">

    <h2>対局開始</h2>

    <h3>プレイヤーを選択</h3>

    <label>プレイヤー1</label>
    <select id="player-select-1">
    </select>

    <label>プレイヤー2</label>
    <select id="player-select-2">
    </select>

    <label>プレイヤー3</label>
    <select id="player-select-3">
    </select>

    <label>プレイヤー4</label>
    <select id="player-select-4">
    </select>

    <button onclick="startGame()">
      点数入力へ
    </button>

    <button onclick="showMainMenu()">
      戻る
    </button>

  </div>


  <!-- ==========================================
       点数入力
       ========================================== -->

  <div id="score-input-screen"
       class="screen"
       style="display: none;">

    <h2>点数入力</h2>

    <label id="p1-label">
      プレイヤー1 持ち点
    </label>

    <input
      type="number"
      id="p1"
      placeholder="例：43200">


    <label id="p2-label">
      プレイヤー2 持ち点
    </label>

    <input
      type="number"
      id="p2"
      placeholder="例：17800">


    <label id="p3-label">
      プレイヤー3 持ち点
    </label>

    <input
      type="number"
      id="p3"
      placeholder="例：25000">


    <label id="p4-label">
      プレイヤー4 持ち点
    </label>

    <input
      type="number"
      id="p4"
      placeholder="例：14000">


    <button onclick="nextRound()">
      この結果を保存し次の局へ
    </button>

    <button onclick="showIntermediateProgress()">
      途中経過を表示
    </button>

    <button onclick="tallyResults()">
      集計する
    </button>

    <button onclick="showMainMenu()">
      対局を中止して戻る
    </button>

    <div id="result"></div>

  </div>

  <!-- ==========================================
     点数確認
     ========================================== -->

<div id="score-check-screen"
     class="screen"
     style="display: none;">

  <h2>点数の確認</h2>

  <div id="score-check-message"></div>

  <button onclick="backToScoreInputForCorrection()">
    入力し直す
  </button>

  <button onclick="continueWithInvalidTotal()">
    このまま続行
  </button>

</div>

  <!-- ==========================================
       途中経過
       ========================================== -->

  <div id="intermediate-progress-screen"
       class="screen"
       style="display: none;">

    <h2>途中経過</h2>

    <div id="intermediate-table"></div>

    <button onclick="backToScoreInput()">
      戻る
    </button>

  </div>


  <!-- ==========================================
       対局結果
       ========================================== -->

  <div id="game-result-screen"
       class="screen"
       style="display: none;">

    <h2>対局結果</h2>

    <div id="game-result"></div>

    <button onclick="saveGameResult()">
      この対局を成績に保存
    </button>

    <button onclick="showMainMenu()">
      メインメニューへ
    </button>

  </div>


  <!-- ==========================================
       成績
       ========================================== -->

  <div id="statistics-screen"
       class="screen"
       style="display: none;">

    <h2>成績</h2>

    <div id="statistics-table"></div>

    <button onclick="showMainMenu()">
      メインメニューへ
    </button>

  </div>


  <!-- ==========================================
       対局履歴
       ========================================== -->

  <div id="history-screen"
       class="screen"
       style="display: none;">

    <h2>対局履歴</h2>

    <div id="history-list"></div>

    <button onclick="showMainMenu()">
      メインメニューへ
    </button>

    <button
      onclick="clearGameHistory()"
      class="danger-button">

      成績データをすべて削除

    </button>

  </div>


  <script src="script.js"></script>

</body>

</html>
